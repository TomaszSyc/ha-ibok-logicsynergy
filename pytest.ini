; A file of its own rather than a [tool.pytest] table: this repository is not a Python
; package, and inventing package metadata to hold a test setting would be misleading.
[pytest]
testpaths = tests

; Home Assistant's own suite runs in this mode, and the fixtures in
; pytest-homeassistant-custom-component are written for it. Without it the plugin's autouse
; async fixture reaches synchronous tests, which pytest 9 treats as an error rather than a
; warning -- every test in the file errors before it runs.
asyncio_mode = auto
