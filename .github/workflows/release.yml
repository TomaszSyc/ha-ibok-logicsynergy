name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Two pushes in quick succession must not race over the same release pull request or draft.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Pull requests opened with the default token start no workflows, so the release pull
      # request would never get the checks that main requires before it can be merged.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # Merging the release pull request creates the release as a draft with its tag
      # (release-please-config.json); everything below finishes it.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  quality:
    name: Quality
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/quality.yml

  publish:
    name: Publish release
    needs: [release-please, quality]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # hacs.json sets zip_release, so HACS installs this tag from the ibok.zip attached to
      # its release, and a release without it cannot be installed. The asset's download
      # count is also the only usage figure the repository gets.
      - name: Build the HACS package
        shell: bash
        run: python3 scripts/build-release-zip.py ibok.zip

      # Red tests leave the draft in place; re-running the failed jobs finishes it, and
      # --clobber replaces a zip a previous attempt already attached.
      - name: Attach the HACS package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ibok.zip --clobber

      # release-please already marked a beta as a pre-release, which HACS offers only to
      # those who switched on beta versions for this repository; publishing keeps that flag.
      - name: Publish the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false
