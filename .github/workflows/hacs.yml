name: HACS

# On every push, because these checks decide whether anyone else can install this at all,
# and nothing in Home Assistant reports them: an instance loads the integration happily
# while HACS refuses to offer it. The weekly run stays -- the action tracks HACS's own
# requirements, which change without this repository changing.
#
# Note it needs a PUBLIC repository to mean anything: HACS reads repository content
# unauthenticated, so on a private one hacs.json and manifest.json come back empty and the
# run fails with errors that look like broken files.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Home Assistant manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
