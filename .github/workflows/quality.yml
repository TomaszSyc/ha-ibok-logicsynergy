name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the whole suite before it publishes a release.
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Ruff and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Home Assistant 2026.9 requires >= 3.14.
          python-version: "3.14"

      - name: Install tooling
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check --output-format=github .

      - name: Formatting
        run: ruff format --check --diff .

      - name: Tests
        run: pytest tests/ -q

  python-min:
    name: Tests on minimum HA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install tooling
        run: pip install -r ci/minimum-ha.txt

      # test_pins.py compares the pins in requirements-dev.txt against the installed
      # plugin, so it fails here on purpose -- this job installs ci/minimum-ha.txt.
      - name: Tests
        run: pytest tests/ -q --ignore=tests/test_pins.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # betterleaks scans history, which needs more than the default shallow clone.
          fetch-depth: 0

      # GitHub's own secret scanning needs Advanced Security on private repositories, so
      # this covers the gap. The binary runs directly rather than through an action: the
      # gitleaks action called the GitHub API to annotate pull requests and failed outright
      # on Dependabot ones, where the token is restricted. All we want is the scan.
      # Exceptions live in .betterleaks.toml, which the scan picks up from the checkout.
      #
      # Dependabot cannot bump a version pinned in a shell variable, so this one moves by hand,
      # together with its checksum from the release's checksums file.
      - name: Scan history for secrets
        shell: bash
        env:
          BETTERLEAKS_VERSION: 1.9.0
          BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
        run: |
          curl -sSfL -o betterleaks.tar.gz \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          # The binary goes on to read the whole history, so a swapped download must not run.
          echo "${BETTERLEAKS_SHA256}  betterleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf betterleaks.tar.gz betterleaks

          ./betterleaks git . --redact --no-banner --exit-code 1 2>&1 | tee scan.log

          # A repository with no readable commits scans as 0 bytes and exits 0, so a broken
          # scan is indistinguishable from a clean one unless we insist it saw something.
          grep -qE "scanned ~[1-9][0-9]* bytes" scan.log || {
            echo "::error::betterleaks scanned nothing; treating this as a failed scan"
            exit 1
          }
