name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Ruff and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Home Assistant 2026.9 requires >= 3.14.
          python-version: "3.14"

      - name: Install tooling
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check --output-format=github .

      - name: Formatting
        run: ruff format --check --diff .

      - name: Tests
        run: pytest tests/ -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history, which needs more than the default shallow clone.
          fetch-depth: 0

      # GitHub's own secret scanning needs Advanced Security on private repositories, so
      # this covers the gap. The gitleaks action is avoided on purpose: it calls the GitHub
      # API to annotate pull requests and fails outright on Dependabot ones, where the token
      # is restricted. All we want is the scan.
      #
      # Dependabot cannot bump a version pinned in a shell variable, so this one moves by hand,
      # together with its checksum from the release's checksums file.
      - name: Scan history for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # The binary goes on to read the whole history, so a swapped download must not run.
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf gitleaks.tar.gz gitleaks

          ./gitleaks git . --redact --no-banner --exit-code 1 2>&1 | tee scan.log

          # gitleaks exits 0 when it cannot read the repository at all, so a broken scan is
          # indistinguishable from a clean one unless we insist it saw something.
          grep -qE "[1-9][0-9]* commits scanned" scan.log || {
            echo "::error::gitleaks scanned no commits; treating this as a failed scan"
            exit 1
          }
