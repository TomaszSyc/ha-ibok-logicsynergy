# Fast checks only. Anything that needs Home Assistant installed runs in CI instead, so a
# commit never waits on a dependency resolve.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Two trailing spaces are a line break in Markdown.
        exclude_types: [markdown]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: mixed-line-ending
        args: [--fix=lf]
      # This integration handles portal passwords. A stray credential must not reach a
      # commit in the first place -- rewriting history afterwards does not unpublish it.
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Same scanner and version as the CI job, just run before the commit exists instead of
  # after it is pushed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Catches values gitleaks does not know to look for -- an account or meter number
      # from a real portal, say. The patterns themselves are not part of this repository;
      # see CONTRIBUTING.md.
      - id: check-denylist
        name: check-denylist
        entry: python3 scripts/check-denylist.py
        language: system
        types: [text]
